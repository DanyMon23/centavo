<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Centavo — tus finanzas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0F2E1A;
    --panel: #1A4D2E;
    --panel-2: #2D6A4F;
    --line: #40916C;
    --coral: #52B788;
    --gold: #FFD60A;
    --lilac: #74C69D;
    --teal: #2D6A4F;
    --pink: #95D5B2;
    --cream: #E8F5E9;
    --muted: #A8D5BA;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600; font-style:italic;
    font-size: 22px;
    color: var(--cream);
  }
  .streak-pill{
    display:flex; align-items:center; gap:6px;
    background: var(--panel-2);
    border-radius: 999px;
    padding: 6px 12px;
    font-weight:700;
    font-size: 14px;
    border: 1px solid var(--line);
  }

  /* ---------- Creature hero ---------- */
  .hero{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border-radius: 24px;
    padding: 22px 18px 18px;
    text-align:center;
    border: 1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .creature-wrap{
    width: 130px; height:130px; margin: 0 auto 6px;
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-8px); }
  }
  .face-happy, .face-neutral, .face-sad{ display:none; }
  .mood-happy .face-happy{ display:inline; }
  .mood-neutral .face-neutral{ display:inline; }
  .mood-sad .face-sad{ display:inline; }

  .bubble{
    background: var(--cream);
    color: #0F2E1A;
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    display:inline-block;
    max-width: 260px;
    margin-top: 4px;
    position:relative;
  }
  .bubble:after{
    content:"";
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-bottom:7px solid var(--cream);
  }
  .creature-name{
    font-size:13px; color: var(--muted); margin-top:10px; letter-spacing:0.3px;
  }

  /* ---------- Cards / sections ---------- */
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    margin-top: 16px;
  }
  .card h2{ font-size: 17px; font-weight:600; font-style:italic; margin-bottom: 12px; color: var(--cream); }

  .balance-row{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 14px; }
  .balance-label{ font-size:12px; color: var(--muted); font-weight:600; }
  .balance-amount{ font-family:'Fraunces', serif; font-size: 30px; font-weight:600; }
  .subtotals{ display:flex; gap:10px; }
  .subtotal{
    flex:1; background: var(--panel-2); border-radius: 14px; padding: 10px 12px;
  }
  .subtotal .label{ font-size:11px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:5px;}
  .subtotal .amt{ font-family:'Fraunces', serif; font-size:18px; margin-top:2px; }

  /* ---------- Quick add ---------- */
  .type-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .type-btn{
    flex:1; padding: 11px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); font-weight:700; font-size:14px;
    cursor:pointer; transition: all .15s ease;
  }
  .type-btn.active[data-type="gasto"]{ background: var(--coral); color:#0F2E1A; border-color:var(--coral); }
  .type-btn.active[data-type="ingreso"]{ background: var(--gold); color:#0F2E1A; border-color:var(--gold); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip{
    border-radius: 999px; padding: 7px 12px; font-size:13px; font-weight:600;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--cream);
    cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .chip.selected{ border-color: var(--cream); background: var(--line); }

  .field-row{ display:flex; gap:8px; margin-bottom:10px; }
  input[type="number"], input[type="text"]{
    width:100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); color: var(--cream); font-size: 15px; font-family:'Manrope';
  }
  input::placeholder{ color: var(--muted); }
  input:focus{ outline: 2px solid var(--gold); outline-offset:1px; }

  .btn-primary{
    width:100%; padding: 13px; border-radius: 14px; border:none;
    background: var(--gold); color: #0F2E1A; font-weight:800; font-size:15px;
    cursor:pointer; margin-top:4px;
  }
  .btn-primary:active{ transform: scale(0.98); }

  /* ---------- Category bars ---------- */
  .cat-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .cat-icon{ font-size:18px; width:24px; text-align:center; flex-shrink:0; }
  .cat-bar-wrap{ flex:1; }
  .cat-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; font-weight:600; }
  .cat-track{ height:8px; background: var(--panel-2); border-radius:999px; overflow:hidden; }
  .cat-fill{ height:100%; border-radius:999px; transition: width .5s ease; }
  .empty-note{ color:var(--muted); font-size:14px; padding: 6px 0; }

  /* ---------- Goal / plant ---------- */
  .goal-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .goal-name{ font-weight:700; font-size:15px; }
  .goal-nums{ font-size:13px; color:var(--muted); font-weight:600; }
  .plant-stage{ text-align:center; margin: 6px 0 12px; }
  .goal-track{ height:10px; background:var(--panel-2); border-radius:999px; overflow:hidden; margin-bottom:12px;}
  .goal-fill{ height:100%; background: linear-gradient(90deg, #52B788, #FFD60A); border-radius:999px; transition:width .5s ease; }
  .goal-actions{ display:flex; gap:8px; }
  .goal-actions input{ flex:1; }
  .btn-secondary{
    padding: 11px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--cream); font-weight:700; font-size:14px; cursor:pointer;
    white-space:nowrap;
  }
  .edit-goal-link{ font-size:12px; color: var(--muted); text-decoration:underline; cursor:pointer; margin-top:10px; display:inline-block; }

  /* ---------- Achievements ---------- */
  .ach-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .ach{
    aspect-ratio: 1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: var(--panel-2); border: 1px solid var(--line); gap:3px; padding:4px;
  }
  .ach.unlocked{ background: linear-gradient(160deg, var(--panel-2), var(--panel)); border-color: var(--gold); }
  .ach .ic{ font-size: 22px; filter: grayscale(1) opacity(0.35); }
  .ach.unlocked .ic{ filter:none; }
  .ach .lb{ font-size: 9.5px; text-align:center; color:var(--muted); font-weight:700; line-height:1.15; }
  .ach.unlocked .lb{ color: var(--cream); }

  /* ---------- History ---------- */
  .hist-item{
    display:flex; align-items:center; gap:10px; padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .hist-item:last-child{ border-bottom:none; }
  .hist-icon{ font-size:18px; width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .hist-mid{ flex:1; min-width:0; }
  .hist-cat{ font-size:14px; font-weight:700; }
  .hist-note{ font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-amt{ font-weight:800; font-size:14px; font-family:'Fraunces', serif; }
  .hist-del{ background:none; border:none; color: var(--muted); font-size:16px; cursor:pointer; padding:4px 6px; }

  /* ---------- Toast ---------- */
  #toast{
    position: fixed; top: 16px; left:50%; transform: translateX(-50%) translateY(-60px);
    background: var(--gold); color:#0F2E1A; font-weight:800; font-size:14px;
    padding: 12px 18px; border-radius: 999px; z-index: 50;
    transition: transform .35s cubic-bezier(.2,1.4,.4,1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    white-space:nowrap;
  }
  #toast.show{ transform: translateX(-50%) translateY(0px); }

  .loading{ text-align:center; padding: 60px 0; color:var(--muted); }

  .fab{
    position: fixed;
    right: 20px;
    bottom: 24px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(150deg, var(--gold), var(--coral));
    border: none;
    color: #0F2E1A;
    font-size: 28px;
    font-weight: 800;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    z-index: 40;
    transition: transform .15s ease;
  }
  .fab:active{ transform: scale(0.92); }
  .fab-hint{
    position: fixed;
    right: 20px;
    bottom: 88px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cream);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 10px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .fab-hint.show{ opacity: 1; }
</style>
</head>
<body>
<div id="toast">🎉 ¡Logro desbloqueado!</div>

<div class="app" id="app">
  <div class="loading" id="loading">Cargando tus finanzas…</div>
</div>

<div class="fab-hint" id="fab-hint">Registro rápido</div>
<button class="fab" id="fab-btn" title="Registro rápido (o pulsa +)">+</button>

<template id="main-template">
  <div class="topbar">
    <div class="brand">Centavo</div>
    <div class="streak-pill">🔥 <span id="streak-count">0</span> días</div>
  </div>

  <div class="hero" id="mood-wrap">
    <div class="creature-wrap">
      <svg viewBox="0 0 130 130" width="130" height="130">
        <ellipse cx="65" cy="118" rx="38" ry="6" fill="#000" opacity="0.15"/>
        <path d="M65 14c30 0 46 22 46 50s-16 52-46 52-46-24-46-52S35 14 65 14z" fill="var(--lilac)"/>
        <ellipse cx="46" cy="58" rx="7" ry="9" fill="#0F2E1A" class="face-happy"/>
        <ellipse cx="84" cy="58" rx="7" ry="9" fill="#0F2E1A" class="face-happy"/>
        <ellipse cx="46" cy="58" rx="7" ry="9" fill="#0F2E1A" class="face-neutral"/>
        <ellipse cx="84" cy="58" rx="7" ry="9" fill="#0F2E1A" class="face-neutral"/>
        <ellipse cx="46" cy="60" rx="7" ry="7" fill="#0F2E1A" class="face-sad"/>
        <ellipse cx="84" cy="60" rx="7" ry="7" fill="#0F2E1A" class="face-sad"/>
        <circle cx="44" cy="52" r="2" fill="#F3EFE4" class="face-happy"/>
        <circle cx="82" cy="52" r="2" fill="#F3EFE4" class="face-happy"/>
        <path d="M46 82c8 10 30 10 38 0" stroke="#0F2E1A" stroke-width="4" fill="none" stroke-linecap="round" class="face-happy"/>
        <path d="M46 86h38" stroke="#0F2E1A" stroke-width="4" fill="none" stroke-linecap="round" class="face-neutral"/>
        <path d="M46 92c8-9 30-9 38 0" stroke="#0F2E1A" stroke-width="4" fill="none" stroke-linecap="round" class="face-sad"/>
        <ellipse cx="34" cy="72" rx="7" ry="4" fill="var(--pink)" opacity="0.6"/>
        <ellipse cx="96" cy="72" rx="7" ry="4" fill="var(--pink)" opacity="0.6"/>
        <g transform="translate(65,17)">
          <path d="M-15,0 L-3,-7 L-3,7 Z" fill="var(--gold)"/>
          <path d="M15,0 L3,-7 L3,7 Z" fill="var(--gold)"/>
          <circle cx="0" cy="0" r="4.5" fill="var(--gold)"/>
        </g>
      </svg>
    </div>
    <div class="bubble" id="creature-message">¡Hola! Vamos a organizar tus finanzas.</div>
    <div class="creature-name">Centavo, tu compañero de ahorro</div>
  </div>

  <div class="card">
    <h2>Este mes</h2>
    <div class="balance-row">
      <div>
        <div class="balance-label">BALANCE</div>
        <div class="balance-amount" id="balance-amount">$0</div>
      </div>
    </div>
    <div class="subtotals">
      <div class="subtotal">
        <div class="label" style="color:var(--gold)">↑ Ingresos</div>
        <div class="amt" id="income-amount">$0</div>
      </div>
      <div class="subtotal">
        <div class="label" style="color:var(--coral)">↓ Gastos</div>
        <div class="amt" id="expense-amount">$0</div>
      </div>
    </div>
  </div>

  <div class="card" id="quickadd-card">
    <h2>Registrar movimiento</h2>
    <div class="type-toggle">
      <button class="type-btn active" data-type="gasto" id="btn-gasto">Gasto</button>
      <button class="type-btn" data-type="ingreso" id="btn-ingreso">Ingreso</button>
    </div>
    <div class="chip-row" id="chip-row"></div>
    <div class="field-row">
      <input type="number" id="amount-input" placeholder="Monto" inputmode="decimal">
    </div>
    <div class="field-row">
      <input type="text" id="note-input" placeholder="Nota (opcional)">
    </div>
    <button class="btn-primary" id="submit-btn">Guardar</button>
  </div>

  <div class="card">
    <h2>Por categoría</h2>
    <div id="category-bars"></div>
  </div>

  <div class="card">
    <h2>Tu meta</h2>
    <div id="goal-section"></div>
  </div>

  <div class="card">
    <h2>Logros</h2>
    <div class="ach-grid" id="achievements-grid"></div>
  </div>

  <div class="card">
    <h2>Historial reciente</h2>
    <div id="history-list"></div>
  </div>
</template>

<script>
(function(){
  const CATS_GASTO = [
    {id:'comida', label:'Comida', icon:'🍔', color:'#52B788'},
    {id:'transporte', label:'Transporte', icon:'🚌', color:'#74C69D'},
    {id:'diversion', label:'Diversión', icon:'🎉', color:'#95D5B2'},
    {id:'casa', label:'Casa', icon:'🏠', color:'#FFD60A'},
    {id:'salud', label:'Salud', icon:'💊', color:'#52B788'},
    {id:'otros', label:'Otros', icon:'📦', color:'#A8D5BA'},
  ];
  const CATS_INGRESO = [
    {id:'sueldo', label:'Sueldo', icon:'💼', color:'#FFD60A'},
    {id:'extra', label:'Extra', icon:'🎁', color:'#95D5B2'},
    {id:'inversion', label:'Inversi��n', icon:'📈', color:'#74C69D'},
    {id:'otros', label:'Otros', icon:'📦', color:'#A8D5BA'},
  ];

  const ACHIEVEMENTS = [
    {id:'streak3', icon:'🔥', label:'3 días seguidos', check:d=>d.streak.count>=3},
    {id:'streak7', icon:'⚡', label:'Semana completa', check:d=>d.streak.count>=7},
    {id:'streak30', icon:'👑', label:'Racha de 30 días', check:d=>d.streak.count>=30},
    {id:'ten', icon:'📝', label:'10 movimientos', check:d=>d.transactions.length>=10},
    {id:'firstIncome', icon:'💰', label:'Primer ingreso', check:d=>d.transactions.some(t=>t.type==='ingreso')},
    {id:'firstGoal', icon:'🌱', label:'Primer ahorro', check:d=>d.goal.saved>0},
    {id:'goalHalf', icon:'🌿', label:'Meta a la mitad', check:d=>d.goal.target>0 && d.goal.saved/d.goal.target>=0.5},
    {id:'goalDone', icon:'🏆', label:'¡Meta cumplida!', check:d=>d.goal.target>0 && d.goal.saved>=d.goal.target},
  ];

  const HAPPY_MSGS = ['¡Vamos muy bien esta semana!', '¡Me encanta tu disciplina!', 'Tu balance se ve saludable ✨', '¡Seguimos creciendo juntos!'];
  const NEUTRAL_MSGS = ['Vamos registrando poco a poco.', '¿Qué gastaste hoy?', 'Cada movimiento cuenta.', 'Sigamos anotando todo.'];
  const SAD_MSGS = ['Esta semana gastamos de más 😬', 'Ojo con los gastos, ¿revisamos juntos?', 'Podemos mejorar esta semana.', 'Un pequeño ajuste nos ayudará.'];

  const STORAGE_KEY = 'centavo-data';
  let data = null;
  let currentType = 'gasto';
  let selectedCat = CATS_GASTO[0].id;

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
  function fmt(n){ return '$' + Number(n).toLocaleString('es-MX', {maximumFractionDigits:0}); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function defaultData(){
    return {
      transactions: [],
      goal: { name: 'Mi meta de ahorro', target: 2000, saved: 0 },
      streak: { count: 0, lastDate: null },
      achievements: {}
    };
  }

  async function loadData(){
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){ return JSON.parse(res.value); }
        return defaultData();
      }
    }catch(e){ /* no Claude storage available here, fall back below */ }
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* localStorage blocked too, start fresh */ }
    return defaultData();
  }

  async function saveData(){
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
        return;
      }
    }catch(e){ /* fall back below */ }
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){ console.error('No se pudo guardar', e); }
  }

  function monthTransactions(){
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    return data.transactions.filter(t => t.date.slice(0,7) === ym);
  }

  function weekNet(){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    let net = 0;
    data.transactions.forEach(t=>{
      if(new Date(t.date) >= cutoff){
        net += t.type==='ingreso' ? t.amount : -t.amount;
      }
    });
    return net;
  }

  function catList(){ return currentType === 'gasto' ? CATS_GASTO : CATS_INGRESO; }
  function findCat(type, id){
    const list = type==='gasto' ? CATS_GASTO : CATS_INGRESO;
    return list.find(c=>c.id===id) || list[list.length-1];
  }

  function showToast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2600);
  }

  function checkAchievements(){
    let newlyUnlocked = null;
    ACHIEVEMENTS.forEach(a=>{
      if(!data.achievements[a.id] && a.check(data)){
        data.achievements[a.id] = new Date().toISOString();
        if(!newlyUnlocked) newlyUnlocked = a;
      }
    });
    if(newlyUnlocked){
      showToast('🎉 Logro: ' + newlyUnlocked.label);
    }
  }

  function registerStreak(){
    const t = todayStr();
    if(data.streak.lastDate === t){ /* ya contado hoy */ }
    else if(data.streak.lastDate === yesterdayStr()){
      data.streak.count += 1;
      data.streak.lastDate = t;
    } else {
      data.streak.count = 1;
      data.streak.lastDate = t;
    }
  }

  function renderCreature(){
    const wrap = document.getElementById('mood-wrap');
    const net = weekNet();
    let mood, msgs;
    if(data.transactions.length === 0){ mood='neutral'; msgs=NEUTRAL_MSGS; }
    else if(net >= 0){ mood='happy'; msgs=HAPPY_MSGS; }
    else if(net > -500){ mood='neutral'; msgs=NEUTRAL_MSGS; }
    else { mood='sad'; msgs=SAD_MSGS; }
    wrap.classList.remove('mood-happy','mood-neutral','mood-sad');
    wrap.classList.add('mood-'+mood);
    document.getElementById('creature-message').textContent = msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('streak-count').textContent = data.streak.count;
  }

  function renderSummary(){
    const mt = monthTransactions();
    const income = mt.filter(t=>t.type==='ingreso').reduce((s,t)=>s+t.amount,0);
    const expense = mt.filter(t=>t.type==='gasto').reduce((s,t)=>s+t.amount,0);
    document.getElementById('balance-amount').textContent = fmt(income-expense);
    document.getElementById('income-amount').textContent = fmt(income);
    document.getElementById('expense-amount').textContent = fmt(expense);
  }

  function renderChips(){
    const row = document.getElementById('chip-row');
    row.innerHTML = '';
    catList().forEach(c=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (c.id===selectedCat ? ' selected':'');
      chip.innerHTML = c.icon + ' ' + c.label;
      chip.onclick = ()=>{ selectedCat = c.id; renderChips(); };
      row.appendChild(chip);
    });
  }

  function renderCategoryBars(){
    const container = document.getElementById('category-bars');
    const mt = monthTransactions().filter(t=>t.type==='gasto');
    if(mt.length===0){
      container.innerHTML = '<div class="empty-note">Aún no hay gastos este mes. ¡Registra el primero!</div>';
      return;
    }
    const totals = {};
    mt.forEach(t=>{ totals[t.category] = (totals[t.category]||0) + t.amount; });
    const max = Math.max(...Object.values(totals));
    const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([catId, amt])=>{
      const cat = findCat('gasto', catId);
      const pct = Math.max(6, Math.round((amt/max)*100));
      return `<div class="cat-row">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-bar-wrap">
          <div class="cat-top"><span>${cat.label}</span><span>${fmt(amt)}</span></div>
          <div class="cat-track"><div class="cat-fill" style="width:${pct}%;background:${cat.color}"></div></div>
        </div>
      </div>`;
    }).join('');
    container.innerHTML = rows;
  }

  function plantEmoji(pct){
    if(pct>=100) return '🌳';
    if(pct>=66) return '🪴';
    if(pct>=33) return '🌿';
    if(pct>0) return '🌱';
    return '🫘';
  }

  function renderGoal(){
    const g = data.goal;
    const pct = g.target>0 ? Math.min(100, Math.round((g.saved/g.target)*100)) : 0;
    const container = document.getElementById('goal-section');
    container.innerHTML = `
      <div class="goal-header">
        <div class="goal-name">${g.name}</div>
        <div class="goal-nums">${pct}%</div>
      </div>
      <div class="plant-stage" style="font-size:46px;">${plantEmoji(pct)}</div>
      <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
      <div class="goal-nums" style="margin-bottom:12px;">${fmt(g.saved)} de ${fmt(g.target)}</div>
      <div class="goal-actions">
        <input type="number" id="goal-add-input" placeholder="Añadir monto" inputmode="decimal">
        <button class="btn-secondary" id="goal-add-btn">Añadir</button>
      </div>
      <div class="edit-goal-link" id="edit-goal-link">Editar meta</div>
    `;
    document.getElementById('goal-add-btn').onclick = onAddToGoal;
    document.getElementById('edit-goal-link').onclick = onEditGoal;
  }

  function renderAchievements(){
    const grid = document.getElementById('achievements-grid');
    grid.innerHTML = ACHIEVEMENTS.map(a=>{
      const unlocked = !!data.achievements[a.id];
      return `<div class="ach ${unlocked?'unlocked':''}">
        <div class="ic">${a.icon}</div>
        <div class="lb">${a.label}</div>
      </div>`;
    }).join('');
  }

  function renderHistory(){
    const list = document.getElementById('history-list');
    const recent = [...data.transactions].sort((a,b)=> b.date.localeCompare(a.date) || 0).slice(0,10);
    if(recent.length===0){
      list.innerHTML = '<div class="empty-note">Todavía no registras movimientos.</div>';
      return;
    }
    list.innerHTML = recent.map(t=>{
      const cat = findCat(t.type, t.category);
      const sign = t.type==='ingreso' ? '+' : '−';
      const color = t.type==='ingreso' ? 'var(--gold)' : 'var(--coral)';
      return `<div class="hist-item">
        <div class="hist-icon" style="background:${cat.color}33">${cat.icon}</div>
        <div class="hist-mid">
          <div class="hist-cat">${cat.label}</div>
          <div class="hist-note">${t.note ? t.note : t.date}</div>
        </div>
        <div class="hist-amt" style="color:${color}">${sign}${fmt(t.amount)}</div>
        <button class="hist-del" data-id="${t.id}" title="Eliminar">✕</button>
      </div>`;
    }).join('');
    list.querySelectorAll('.hist-del').forEach(btn=>{
      btn.onclick = ()=> deleteTransaction(btn.getAttribute('data-id'));
    });
  }

  function renderAll(){
    renderCreature();
    renderSummary();
    renderChips();
    renderCategoryBars();
    renderGoal();
    renderAchievements();
    renderHistory();
  }

  async function onSubmit(){
    const amountInput = document.getElementById('amount-input');
    const noteInput = document.getElementById('note-input');
    const amount = parseFloat(amountInput.value);
    if(!amount || amount <= 0){
      amountInput.focus();
      return;
    }
    data.transactions.push({
      id: uid(),
      type: currentType,
      amount: amount,
      category: selectedCat,
      note: noteInput.value.trim(),
      date: todayStr()
    });
    registerStreak();
    checkAchievements();
    await saveData();
    amountInput.value = '';
    noteInput.value = '';
    renderAll();
  }

  async function deleteTransaction(id){
    data.transactions = data.transactions.filter(t=>t.id!==id);
    await saveData();
    renderAll();
  }

  async function onAddToGoal(){
    const input = document.getElementById('goal-add-input');
    const amount = parseFloat(input.value);
    if(!amount || amount<=0){ input.focus(); return; }
    data.goal.saved += amount;
    checkAchievements();
    await saveData();
    renderAll();
  }

  async function onEditGoal(){
    const name = prompt('Nombre de tu meta:', data.goal.name);
    if(name===null) return;
    const targetStr = prompt('¿Cuánto quieres ahorrar en total?', data.goal.target);
    if(targetStr===null) return;
    const target = parseFloat(targetStr);
    if(name.trim()) data.goal.name = name.trim();
    if(target>0) data.goal.target = target;
    await saveData();
    renderAll();
  }

  function setType(type){
    currentType = type;
    document.getElementById('btn-gasto').classList.toggle('active', type==='gasto');
    document.getElementById('btn-ingreso').classList.toggle('active', type==='ingreso');
    selectedCat = catList()[0].id;
    renderChips();
  }

  function jumpToQuickAdd(){
    const card = document.getElementById('quickadd-card');
    if(!card) return;
    card.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=> document.getElementById('amount-input').focus(), 350);
  }

  function setupShortcut(){
    document.getElementById('fab-btn').onclick = jumpToQuickAdd;

    const hint = document.getElementById('fab-hint');
    setTimeout(()=> hint.classList.add('show'), 600);
    setTimeout(()=> hint.classList.remove('show'), 3200);

    document.addEventListener('keydown', (e)=>{
      const tag = document.activeElement.tagName;
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';
      if((e.key === '+' || e.key === '=') && !isTyping){
        e.preventDefault();
        jumpToQuickAdd();
      }
    });
  }

  async function init(){
    try{
      data = await loadData();
      const tpl = document.getElementById('main-template');
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(tpl.content.cloneNode(true));

      document.getElementById('btn-gasto').onclick = ()=> setType('gasto');
      document.getElementById('btn-ingreso').onclick = ()=> setType('ingreso');
      document.getElementById('submit-btn').onclick = onSubmit;

      renderAll();
      setupShortcut();
    }catch(err){
      document.getElementById('app').innerHTML =
        '<div class="loading">No se pudo cargar. Si abriste este archivo desde iCloud/Files, intenta abrirlo directamente en Safari (no en la vista previa) y vuelve a intentarlo.</div>';
      console.error(err);
    }
  }

  init();
})();
</script>
</body>
</html>
